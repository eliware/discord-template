version: "15.0"
description: Repository-specific Discord application requirements.
directives:
  - id: E-1030.0
    dos:
      - Keep root commands/ and events/ as discovery adapters for @eliware/discord.
      - Keep command and event code in src/ with matching tests/ files.
      - Validate command definitions and supported locale catalogs before Discord client startup.
      - >-
        Use one resolved app root for environment loading, configuration checks, and
        library discovery.
      - Use library signal and process handlers when the app has no other services to stop.
      - Keep only clientReady and interactionCreate as default event adapters.
      - Add optional event adapters only when the application uses them.
      - Use only the Guilds intent for the default slash command application.
      - Provide a command that adds a message key to locale catalogs without replacing translations.
    donts:
      - Do not move discovery folders, connect to Discord in tests, or commit credentials.
      - Do not enable privileged gateway intents in the default application.
